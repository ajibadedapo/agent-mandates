name: Principle change
description: Propose a change to a principle, requirement, maturity level or audit check.
title: "Principle change: "
labels: ["principle change"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Quote the text you want changed.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: The failure the current text allows, or the cost it imposes, with an example.
    validations:
      required: true
  - type: checkboxes
    id: affects
    attributes:
      label: What it changes
      options:
        - label: A MUST requirement
        - label: A SHOULD requirement
        - label: A maturity level
        - label: An audit check
